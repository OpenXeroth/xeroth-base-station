name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck bats
          pipx install ruff && pipx install pyflakes

      - name: VERSION must be strict semver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "ERROR: VERSION '${VERSION}' is not strict semver"; exit 1; }

      - name: bash -n on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: shellcheck on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck -x --severity=warning

      - name: ruff on payload Python
        run: |
          ruff check \
              --select=E,F,W,B,UP \
              --target-version=py39 \
              payload/

      - name: pyflakes on payload Python
        run: |
          pyflakes payload/

      - name: bats test suite
        run: |
          bats -r tests/bats/
