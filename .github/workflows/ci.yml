name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    # GitHub-hosted. This job used to run on naturecam-jhb, the production
    # wildlife-streaming box, purely because that machine happened to have
    # shellcheck, bats, ruff and pyflakes installed. Those runners were deleted
    # on 2026-08-26.
    #
    # An earlier revision of this file targeted [self-hosted, tingana]. That
    # cannot work here: GitHub withholds self-hosted runners from PUBLIC
    # repositories unless the org runner group sets
    # allows_public_repositories, because a fork's pull request could then run
    # arbitrary code on our infrastructure. Measured 2026-08-26 -- the org's
    # Default runner group has it false, and this job sat queued for 220s with
    # no runner assigned before being cancelled. That gate should stay closed.
    #
    # Hosted is the right answer instead: this repository is public, so hosted
    # Actions are free and unlimited. The ubuntu-latest condition in NatureCam
    # issue #502 is private-repo only and does not apply here.
    #
    # Tools are still fetched explicitly below rather than taken from the
    # image. Verified against actions/runner-images: the image DOES ship
    # shellcheck, but 0.9.0 on 24.04 and 0.8.0 on 22.04 -- so relying on it
    # would let the linter's version drift silently when ubuntu-latest moves.
    # bats is not on the image at all. Pinning both keeps lint results
    # reproducible. Neither install needs root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff and pyflakes
        run: pip install ruff pyflakes

      - name: Install shellcheck and bats (no root available)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"

          SC_VER=v0.10.0
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" \
            | tar -xJ -C "${RUNNER_TEMP}" "shellcheck-${SC_VER}/shellcheck"
          mv "${RUNNER_TEMP}/shellcheck-${SC_VER}/shellcheck" "${RUNNER_TEMP}/bin/"

          git clone --depth 1 --branch v1.11.0 \
            https://github.com/bats-core/bats-core.git "${RUNNER_TEMP}/bats-core"
          "${RUNNER_TEMP}/bats-core/install.sh" "${RUNNER_TEMP}/bats-prefix"
          ln -s "${RUNNER_TEMP}/bats-prefix/bin/bats" "${RUNNER_TEMP}/bin/bats"

          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Report what this runner actually provides
        # Recorded on every run so release.yml can be migrated on measurement
        # rather than assumption: it needs rsync, tar, sha256sum and gcloud.
        run: |
          for t in shellcheck bats ruff pyflakes systemd-analyze rsync tar sha256sum gcloud jq; do
            printf '%-16s ' "$t"
            command -v "$t" >/dev/null 2>&1 && command -v "$t" || echo "MISSING"
          done

      - name: VERSION must be strict semver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "ERROR: VERSION '${VERSION}' is not strict semver"; exit 1; }

      - name: bash -n on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: shellcheck on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck -x --severity=warning

      - name: ruff on payload Python
        run: |
          ruff check \
              --select=E,F,W,B,UP \
              --target-version=py39 \
              payload/

      - name: pyflakes on payload Python
        run: |
          pyflakes payload/

      - name: Check systemd unit files
        # This used to be `systemd-analyze verify`, which needs systemd and a
        # host whose /usr/local/bin has str2str and convbin symlinked in so
        # ExecStart= path checks resolve. A container runner has neither.
        #
        # The old step ended in `|| { echo warning; true; }`, which swallows
        # command-not-found too -- so simply moving it would have produced a
        # green check that ran nothing. It either runs, or it says out loud
        # that it did not.
        #
        # On ubuntu-latest the primary branch is the one that runs: the hosted
        # image ships systemd 255.4 (verified against actions/runner-images),
        # so systemd-analyze is present and the real check executes. The
        # fallback is kept for the case where it is not.
        run: |
          set -euo pipefail
          UNITS="payload/systemd/gnss-capture.service payload/systemd/gnss-health.service"

          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify --recursive-errors=no $UNITS || {
              echo "::warning::systemd-analyze verify reported issues — see log"
              true
            }
          else
            echo "::warning::systemd-analyze is not available on this runner; \
          running a structural check instead. Restoring the full check needs \
          systemd in the runner image."
            EXIT=0
            for unit in $UNITS; do
              echo "Checking $unit..."
              grep -q '^\[Unit\]' "$unit"    || { echo "ERROR: $unit missing [Unit]"; EXIT=1; }
              grep -q '^\[Service\]' "$unit" || { echo "ERROR: $unit missing [Service]"; EXIT=1; }
              grep -q '^ExecStart=' "$unit"   || { echo "ERROR: $unit missing ExecStart="; EXIT=1; }
            done
            exit $EXIT
          fi

      - name: bats test suite
        run: |
          bats -r tests/bats/
