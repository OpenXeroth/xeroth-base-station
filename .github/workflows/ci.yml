name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    # Self-hosted runner on the JHB VM (Ubuntu 24.04 x86_64). The runner
    # has rtklib, shellcheck, bats, jq, ruff, pyflakes, python3, systemd
    # pre-installed; see infra/SELF_HOSTED_RUNNER.md for the provisioning
    # the runner host needs. If/when GitHub-hosted runners are reinstated
    # for this repo, change runs-on to ubuntu-22.04 and reinstate an
    # apt-get + pip install step before the lint steps below.
    runs-on: [self-hosted, jhb]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: VERSION must be strict semver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=${VERSION}"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "ERROR: VERSION '${VERSION}' is not strict semver"; exit 1; }

      - name: bash -n on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 bash -n

      - name: shellcheck on every .sh
        run: |
          find . -type f -name "*.sh" -not -path "./.git/*" -print0 \
            | xargs -0 shellcheck -x --severity=warning

      - name: ruff on payload Python
        run: |
          ruff check \
              --select=E,F,W,B,UP \
              --target-version=py39 \
              payload/

      - name: pyflakes on payload Python
        run: |
          pyflakes payload/

      - name: systemd-analyze verify on every .service
        # The runner host has str2str and convbin symlinked into
        # /usr/local/bin/ so ExecStart= path-existence checks pass.
        # We run systemd-analyze verify directly against the source
        # files — it resolves After=/Wants= against the runner's
        # installed system units (network-online.target, tailscaled.service,
        # dev-ttyUSB0.device — the latter may be a soft fail on a
        # machine with no FTDI cable attached, which is fine).
        run: |
          systemd-analyze verify --recursive-errors=no \
              payload/systemd/gnss-capture.service \
              payload/systemd/gnss-health.service || {
              echo "::warning::systemd-analyze verify reported issues — see log for resolver-level findings"
              true
          }

      - name: bats test suite
        run: |
          bats -r tests/bats/
