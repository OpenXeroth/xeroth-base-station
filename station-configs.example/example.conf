# Xeroth Base Station — station.conf example
#
# Copy this file to /home/xeroth/base_station/scripts/station.conf
# on the station host BEFORE running install.sh, and edit:
#
# - STATION_ID: a short uppercase identifier, e.g. MY_STATION, GNSS01.
#   This is what appears in /health JSON, in upload paths under
#   gs://${DATA_BUCKET}/${STATION_ID}/YYYY/DOY/, and in
#   /home/xeroth/base_station/logs/automation.log.
#
# - APPROX POSITION XYZ (ECEF, metres): the first non-comment,
#   non-key-value line is read as three whitespace-separated doubles
#   and injected as the APPROX POSITION XYZ header of every RINEX
#   .obs file produced. These are your station's antenna reference
#   point (ARP) coordinates in ITRF2020 or equivalent.
#
#   Obtain them via a long static observation post-processed through
#   AUSPOS (geoscience.gov.au), OPUS (NGS, US), or any equivalent
#   PPP service. 24+ hours of dual-frequency data at the deployment
#   site gives ARP coordinates to ~5–15 mm 95% CL.
#
#   If you do not have coordinates yet, leave the placeholder line
#   below as "0.0000 0.0000 0.0000". The upload worker detects that
#   sentinel and skips the APPROX POSITION XYZ injection; the
#   downstream PPK process will infer the position from the data
#   itself, less precisely.
#
# - UPLOAD_KEY: the station upload key from your base.xeroth.ai
#   dashboard, once you have been approved as an operator. Set
#   STATION_ID to the identifier the dashboard gives you (XER3, ...).
#   With a key the station uploads to the Xeroth network over HTTPS and
#   needs no Google Cloud account. Without a key (and without a Xeroth
#   service-account key file) the RINEX files stay on the station, where
#   the disk guard removes the oldest when space runs low.
#
# Format example (replace with your real values):

STATION_ID=MY_STATION
# UPLOAD_KEY=xrx_...

# ECEF Cartesian (X Y Z metres) — REPLACE with your AUSPOS/OPUS result.
# Source: <PPP service> Job <id>, <date>
# Epoch:  <date>
# Uncertainty 95% CL: E=<m> N=<m> U=<m>
0.0000 0.0000 0.0000
